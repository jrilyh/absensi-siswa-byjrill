<style>

/* =========================
   PILIHAN KELAS
========================= */

#kelas {

    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border: 2px solid #ddd;

    font-size: 16px;

    margin-top: 8px;

    background: white;

}


/* =========================
   STATUS
========================= */

.status-group {

    margin: 20px 0;

}


.status-group > label {

    display: block;

    margin-bottom: 10px;

}


.status-options {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

}


.status-option input {

    display: none;

}


.status-option span {

    display: block;

    text-align: center;

    padding: 16px 10px;

    border: 2px solid #ddd;

    border-radius: 16px;

    background: white;

    cursor: pointer;

    font-size: 28px;

    transition: 0.2s;

}


.status-option span b {

    display: block;

    font-size: 15px;

    margin-top: 5px;

}


.status-option input:checked + span {

    border-color: #4f46e5;

    background: #eef2ff;

    transform: scale(1.03);

}


.status-option span:hover {

    transform: scale(1.03);

}


/* =========================
   CONFETTI
========================= */

.confetti {

    position: fixed;

    top: -20px;

    width: 10px;

    height: 16px;

    z-index: 99999;

    pointer-events: none;

    animation:
        confettiFall
        linear
        forwards;

}


@keyframes confettiFall {

    0% {

        transform:
            translateY(-20px)
            rotate(0deg);

        opacity: 1;

    }

    100% {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;

    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .status-options {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

</style>

</head>

<script>


/* =========================

========================= */

========================= */

const namaInput =

const pesan =
    document.getElementById("pesan");

const tanggalElement =
    document.getElementById("tanggal");

const jamElement =
    document.getElementById("jam");

const daftarAbsensi =
    document.getElementById("daftarAbsensi");

const jumlahElement =
    document.getElementById("jumlah");

const btnHapus =
    document.getElementById("btnHapus");


/* =========================
   DATA
========================= */

let dataAbsensi =
    JSON.parse(
        localStorage.getItem(
            "dataAbsensi"
        )
    ) || [];


/* =========================
   WAKTU WIB
========================= */

function getWaktuWIB() {

    const sekarang =
        new Date();


    const tanggal =
        new Intl.DateTimeFormat(
            "id-ID",
            {

                timeZone:
                    "Asia/Jakarta",

                weekday:
                    "long",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }
        ).format(sekarang);


    const waktu =
        new Intl.DateTimeFormat(
            "id-ID",
            {

                timeZone:
                    "Asia/Jakarta",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false

            }
        ).format(sekarang);


    return {

        tanggal,

        waktu

    };

}


/* =========================
   JAM
========================= */

function updateJam() {

    const waktu =
        getWaktuWIB();


    tanggalElement.textContent =
        waktu.tanggal;


    jamElement.textContent =
        waktu.waktu;

}


updateJam();


setInterval(
    updateJam,
    1000
);


/* =========================
   SIMPAN
========================= */

function simpanData() {

    localStorage.setItem(

        "dataAbsensi",

        JSON.stringify(
            dataAbsensi
        )

    );

}


/* =========================
   TAMPILKAN
========================= */

function tampilkanAbsensi() {


    jumlahElement.textContent =
        dataAbsensi.length;


    if (
        dataAbsensi.length === 0
    ) {

        daftarAbsensi.innerHTML = `

            <div class="empty">

                <div>
                    📝
                </div>

                <p>
                    Belum ada siswa yang absen
                </p>

            </div>

        `;

        return;

    }


    daftarAbsensi.innerHTML =
        "";


    dataAbsensi.forEach(
        siswa => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "student";


            const huruf =
                siswa.nama
                    .trim()
                    .charAt(0)
                    .toUpperCase();


            item.innerHTML = `

                <div class="avatar">

                    ${huruf}

                </div>


                <div class="student-info">

                    <strong>

                        ${escapeHTML(
                            siswa.nama
                        )}

                    </strong>


                    <small>

                        ${escapeHTML(
                            siswa.kelas
                        )}

                        •

                        ${escapeHTML(
                            siswa.tanggal
                        )}

                        •

                        ${escapeHTML(
                            siswa.waktu
                        )}

                        WIB

                    </small>

                </div>


                <div class="status">

                    ${escapeHTML(
                        siswa.status
                    )}

                </div>

            `;


            daftarAbsensi
                .appendChild(item);

        }
    );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   CONFETTI 🎊
========================= */

function tampilkanConfetti() {


    const warna = [

        "#ff4757",
        "#ffa502",
        "#2ed573",
        "#1e90ff",
        "#a55eea",
        "#ff6b81",
        "#00d2d3"

    ];


    for (
        let i = 0;
        i < 120;
        i++
    ) {


        const kertas =
            document.createElement(
                "div"
            );


        kertas.className =
            "confetti";


        kertas.style.left =
            Math.random() * 100 +
            "vw";


        kertas.style.background =
            warna[
                Math.floor(
                    Math.random() *
                    warna.length
                )
            ];


        kertas.style.width =
            Math.random() * 8 + 6 +
            "px";


        kertas.style.height =
            Math.random() * 12 + 8 +
            "px";


        kertas.style.animationDuration =
            Math.random() * 2 + 2 +
            "s";


        kertas.style.animationDelay =
            Math.random() * 0.5 +
            "s";


        document.body.appendChild(
            kertas
        );


        setTimeout(
            () => {

                kertas.remove();

            },

            4000

        );

    }

}
