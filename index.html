<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Absensi Siswa</title>

    <link rel="stylesheet" href="style.css">

    <!-- EMAILJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>


<body>

    <!-- BACKGROUND -->
    <div class="background"></div>


    <main class="container">


        <!-- =========================
             HEADER
        ========================== -->

        <section class="header">

            <div class="logo">
                📚
            </div>

            <h1>
                ABSENSI SISWA
            </h1>

            <p>
                Silakan isi data kehadiran kamu
            </p>

            <div class="date-box">

                <span id="tanggal">
                    Memuat tanggal...
                </span>

                <span>•</span>

                <span id="jam">
                    00:00:00
                </span>

                <b>WIB</b>

            </div>

        </section>



        <!-- =========================
             FORM ABSENSI
        ========================== -->

        <section class="attendance-card">


            <!-- NAMA -->

            <div class="input-group">

                <label>
                    👤 Nama Siswa
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Ketik nama kamu..."
                    autocomplete="off"
                >

            </div>



            <!-- KELAS -->

            <div class="input-group">

                <label>
                    🏫 Kelas
                </label>

                <input
                    type="text"
                    id="kelas"
                    placeholder="Contoh: 7A, 8B, 9C..."
                    autocomplete="off"
                >

            </div>



            <!-- STATUS -->

            <div class="status-group">

                <label>
                    📋 Status Kehadiran
                </label>


                <div class="status-options">


                    <!-- HADIR -->

                    <label class="status-option">

                        <input
                            type="radio"
                            name="status"
                            value="HADIR"
                            checked
                        >

                        <span>

                            <span class="status-emoji">
                                😊
                            </span>

                            <span class="status-text">
                                Hadir
                            </span>

                        </span>

                    </label>



                    <!-- SAKIT -->

                    <label class="status-option">

                        <input
                            type="radio"
                            name="status"
                            value="SAKIT"
                        >

                        <span>

                            <span class="status-emoji">
                                🤒
                            </span>

                            <span class="status-text">
                                Sakit
                            </span>

                        </span>

                    </label>



                    <!-- IZIN -->

                    <label class="status-option">

                        <input
                            type="radio"
                            name="status"
                            value="IZIN"
                        >

                        <span>

                            <span class="status-emoji">
                                📝
                            </span>

                            <span class="status-text">
                                Izin
                            </span>

                        </span>

                    </label>



                    <!-- ALPA -->

                    <label class="status-option">

                        <input
                            type="radio"
                            name="status"
                            value="ALPA"
                        >

                        <span>

                            <span class="status-emoji">
                                ❌
                            </span>

                            <span class="status-text">
                                Alpa
                            </span>

                        </span>

                    </label>


                </div>

            </div>



            <!-- BUTTON -->

            <button id="btnKirim">

                <span>
                    ✓
                </span>

                KIRIM ABSENSI

            </button>



            <!-- PESAN -->

            <p id="pesan"></p>


        </section>



        <!-- =========================
             DAFTAR ABSENSI
        ========================== -->

        <section class="list-card">


            <div class="list-header">

                <div>

                    <h2>
                        📋 Daftar Kehadiran
                    </h2>

                    <p>
                        Siswa yang sudah mengisi absensi
                    </p>

                </div>


                <div class="total">

                    <span id="jumlah">
                        0
                    </span>

                    <small>
                        Siswa
                    </small>

                </div>

            </div>



            <div
                id="daftarAbsensi"
                class="attendance-list">
            </div>



            <button
                id="btnHapus"
                class="delete-button">

                🗑️ Hapus Semua Data

            </button>


        </section>



        <!-- FOOTER -->

        <footer>

            Absensi Siswa • Waktu Indonesia Barat (WIB)

        </footer>


    </main>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
